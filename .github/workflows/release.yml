name: release

# A tag is the owner's act (WF-6): the workflow builds the gem and drafts a
# GitHub release from it, with the full gate green before anything is
# attached. It never publishes to rubygems.org — that stays with the owner
# (CP-6), from a signed environment, when they say so.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gem:
    name: Gate, build the gem, draft the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: The full gate
        run: bundle exec rake
      - name: The emulator scenario, deployed and destroyed
        run: |
          mkdir -p "$HOME/.aws-emulator-build"
          cat > "$HOME/.aws-emulator-build/Dockerfile" <<'DOCKERFILE'
          FROM public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          ADD https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator-x86_64.rpm /tmp/aws-emulator.rpm
          RUN rpm -i /tmp/aws-emulator.rpm && rm /tmp/aws-emulator.rpm \
              && mkdir -p /home/emulator && chown 1000 /home/emulator
          USER 1000
          ENV HOME=/home/emulator EMULATOR_BIND_ADDRESS=0.0.0.0
          ENTRYPOINT ["aws-emulator"]
          DOCKERFILE
          docker build -t aws-emulator "$HOME/.aws-emulator-build"
          mkdir -p "$HOME/.aws/emulator"
          sudo chmod -R 777 "$HOME/.aws/emulator"
          docker run --rm --name aws-emulator --memory=2g --memory-swap=2g \
            -p 127.0.0.1:9297:9297 -e HOME="$HOME" -e EMULATOR_TELEMETRY=off \
            -v "$HOME/.aws/emulator:$HOME/.aws/emulator" aws-emulator -p 9297 &
          for i in $(seq 30); do
            [ -f "$HOME/.aws/emulator/9297/ca.pem" ] && break
            sleep 1
          done
          sudo chmod -R a+rX "$HOME/.aws/emulator/9297"
          for i in $(seq 30); do
            curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health >/dev/null && break
            sleep 1
          done
          {
            echo "AWS_ENDPOINT_URL=https://127.0.0.1:9297"
            echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/9297/emulator_credentials"
            echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/9297/config"
            echo "SSL_CERT_FILE=$HOME/.aws/emulator/9297/ca.pem"
            echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "AWS_REGION=us-east-1"
            echo "AWS_DEFAULT_REGION=us-east-1"
            echo "RUBY_CDK_AWS_PROFILE=default"
            echo "RUBY_CDK_ALLOW_ACCOUNT=000000000000"
            echo "RUBY_CDK_ALLOW_REGION=us-east-1"
          } >> "$GITHUB_ENV"
          bundle exec rake integration
          docker rm -f aws-emulator || true
      - name: Build the gem
        run: gem build ruby-cdk.gemspec
      - name: Draft the release with the gem attached
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft --verify-tag \
            --title "ruby-cdk ${GITHUB_REF_NAME#v}" \
            --notes "Drafted by the release workflow, from the tag's commit, with the full gate and the emulator deployment green. Review CHANGELOG.md, attach its notes, and publish when the checklist of WF-6 is done." \
            ./ruby-cdk-*.gem
