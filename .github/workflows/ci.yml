name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every check is its own job, so they all run at once.
jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rake coverage:check

  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake rubocop

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake typecheck

  determinism:
    name: Determinism (byte-identical synthesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake determinism

  parity:
    name: Parity with the CDK's own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake parity

  purity:
    name: Purity (no shell, no JavaScript toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake purity

  clean-install:
    name: Clean install, no build tools
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0-slim
    steps:
      - uses: actions/checkout@v7
      - run: gem build ruby-cdk.gemspec
      - run: gem install ./ruby-cdk-*.gem --no-document
      - run: ruby-cdk version

  # A deploy and a destroy of a real stack, through real CloudFormation calls,
  # against the AWS Emulator in a container. No AWS account, no credentials:
  # the emulator generates its own, and the WF-5 guard checks them the same
  # way it checks the sandbox's. This is the pre-flight layer; the release
  # evidence still comes from the real sandbox (WF-5).
  emulator:
    name: Deploy and destroy against the AWS Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Emulator up, SDK pointed at it, hello deployed and destroyed
        run: |
          mkdir -p "$HOME/.aws-emulator-build" "$HOME/.aws/emulator"
          # The container runs as uid 1000 and Docker creates the mounted
          # directory as root: without this the emulator cannot write its
          # certificate or its credentials (Permission denied on serve).
          sudo chmod -R 777 "$HOME/.aws/emulator"
          cat > "$HOME/.aws-emulator-build/Dockerfile" <<'DOCKERFILE'
          FROM public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          ADD https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator-x86_64.rpm /tmp/aws-emulator.rpm
          RUN rpm -i /tmp/aws-emulator.rpm && rm /tmp/aws-emulator.rpm \
              && mkdir -p /home/emulator && chown 1000 /home/emulator
          USER 1000
          ENV HOME=/home/emulator EMULATOR_BIND_ADDRESS=0.0.0.0
          ENTRYPOINT ["aws-emulator"]
          DOCKERFILE
          docker build -t aws-emulator "$HOME/.aws-emulator-build"
          # One step holds the whole run: a process backgrounded in a step is
          # killed when the step ends, so the container runs detached here and
          # is stopped at the end of the step, whatever its outcome.
          docker run --rm --name aws-emulator --memory=2g --memory-swap=2g \
            -d -p 127.0.0.1:9297:9297 -e HOME="$HOME" -e EMULATOR_TELEMETRY=off \
            -v "$HOME/.aws/emulator:$HOME/.aws/emulator" aws-emulator -p 9297
          trap 'docker rm -f aws-emulator >/dev/null 2>&1 || true' EXIT
          for i in $(seq 30); do
            curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health >/dev/null && break
            sleep 1
          done
          if ! curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health; then
            echo "the emulator never became healthy; its logs:"
            docker logs aws-emulator || true
            ls -la "$HOME/.aws/emulator" "$HOME/.aws/emulator/9297" 2>/dev/null || true
            exit 1
          fi
          {
            echo "AWS_ENDPOINT_URL=https://127.0.0.1:9297"
            echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/9297/emulator_credentials"
            echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/9297/config"
            echo "SSL_CERT_FILE=$HOME/.aws/emulator/9297/ca.pem"
            echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "AWS_REGION=us-east-1"
            echo "AWS_DEFAULT_REGION=us-east-1"
            echo "RUBY_CDK_AWS_PROFILE=default"
            echo "RUBY_CDK_ALLOW_ACCOUNT=000000000000"
            echo "RUBY_CDK_ALLOW_REGION=us-east-1"
          } >> "$GITHUB_ENV"
          bundle exec rake integration
